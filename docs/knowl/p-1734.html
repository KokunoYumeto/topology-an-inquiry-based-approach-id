<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Ekuivalensi metrik selalu mengakibatkan ekuivalensi topologis (dengan menggunakan topologi yang diinduksi oleh metrik), dan pembuktiannya diserahkan kepada <a href="" class="xref" data-knowl="./knowl/ex_me_implies_te.html" title="Latihan 3">Latihan 3</a>. Jadi, ekuivalensi metrik merupakan syarat yang lebih kuat daripada ekuivalensi topologis.</div>
