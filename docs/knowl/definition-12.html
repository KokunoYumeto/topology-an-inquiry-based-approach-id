</h3> <div class="para logical">
<div class="para">Misalkan <span class="process-math">\(x = (x_1, x_2, \ldots,
x_n)\)</span> dan <span class="process-math">\(y = (y_1, y_2, \ldots,
y_n)\)</span> merupakan kata-kata dalam <span class="process-math">\(X^n\text{.}\)</span> <dfn class="terminology">Jarak Hamming</dfn> <span class="process-math">\(d_H\)</span> antara <span class="process-math">\(x\)</span> dan <span class="process-math">\(y\)</span> adalah</div>
<div class="displaymath process-math">
\begin{equation*}
d_H(x,y) = \sum_{i=1}^n | x_i-y_i |\text{.}
\end{equation*}
