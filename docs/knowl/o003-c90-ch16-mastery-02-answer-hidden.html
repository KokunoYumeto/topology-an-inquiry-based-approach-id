<body class="ignore-math"><div class="answer solution-like"><div class="para">Relasi tersebut mengelompokkan tepat titik-titik dalam serat yang sama. Pemetaan <span class="process-math">\(h\)</span> terdefinisi dengan baik dan bijektif, serta memenuhi <span class="process-math">\(h\circ q=p\text{.}\)</span> Identitas <span class="process-math">\(q^{-1}(h^{-1}(U))=p^{-1}(U)\)</span> menunjukkan bahwa <span class="process-math">\(U\)</span> terbuka tepat ketika <span class="process-math">\(h^{-1}(U)\)</span> terbuka.</div></div></body>
