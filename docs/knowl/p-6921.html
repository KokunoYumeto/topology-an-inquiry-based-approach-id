<div class="para">Titik <span class="process-math">\(x\in X\setminus A\)</span> dipilih sebarang, sehingga setiap titik komplemen memiliki lingkungan buka di dalam komplemen. Maka <span class="process-math">\(X\setminus A\)</span> terbuka dan <span class="process-math">\(A\)</span> tertutup. Dengan demikian, setiap subhimpunan kompak dari ruang Hausdorff merupakan himpunan tertutup.</div>
