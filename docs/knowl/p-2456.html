<div class="para">Tetapkan <span class="process-math">\(M=\max\{\sup(A),\sup(B)\}\text{.}\)</span> Jika <span class="process-math">\(u\in A\cup B\text{,}\)</span> maka <span class="process-math">\(u\in A\)</span> atau <span class="process-math">\(u\in B\text{.}\)</span> Dalam kasus pertama, <span class="process-math">\(u\leq\sup(A)\leq M\text{;}\)</span> dalam kasus kedua, <span class="process-math">\(u\leq\sup(B)\leq M\text{.}\)</span> Jadi <span class="process-math">\(M\)</span> adalah batas atas bagi <span class="process-math">\(A\cup B\text{.}\)</span>
