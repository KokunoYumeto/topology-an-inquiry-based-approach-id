<div class="para">Misalkan <span class="process-math">\((X,\tau)\)</span> suatu ruang topologi. Suatu <dfn class="terminology">subruang</dfn> dari <span class="process-math">\((X,\tau)\)</span> adalah subhimpunan tak kosong <span class="process-math">\(A\)</span> dari <span class="process-math">\(X\)</span> yang dibekali topologi</div>
<div class="displaymath process-math">
\begin{equation*}
\tau_A = \{O \cap A \mid O \in \tau\}\text{.}
\end{equation*}
