<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Jika <span class="process-math">\(U,V\)</span> terbuka dan tak kosong, maka <span class="process-math">\(X\setminus(U\cap V)=(X\setminus U)\cup(X\setminus V)\)</span> berhingga. Karena <span class="process-math">\(X\)</span> tak hingga, <span class="process-math">\(U\cap V\)</span> tidak kosong. Maka dua titik berbeda tidak dapat mempunyai lingkungan terbuka saling lepas, dan <span class="process-math">\(X\)</span> tidak Hausdorff.</div>
