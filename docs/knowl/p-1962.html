<div class="para">Untuk <span class="process-math">\(x,y,z\in X^n\text{,}\)</span> pertidaksamaan nilai mutlak memberi <span class="process-math">\(|x_i-y_i|\leq|x_i-z_i|+|z_i-y_i|\)</span> untuk setiap <span class="process-math">\(i\text{.}\)</span> Menjumlahkan dari <span class="process-math">\(i=1\)</span> sampai <span class="process-math">\(n\)</span> menghasilkan <span class="process-math">\(d_H(x,y)\leq d_H(x,z)+d_H(z,y)\text{.}\)</span> Jadi <span class="process-math">\(d_H\)</span> memenuhi seluruh aksioma metrik.</div>
