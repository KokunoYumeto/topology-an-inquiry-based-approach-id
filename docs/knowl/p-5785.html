<div class="para">Topologi indiskret pada <span class="process-math">\(\{0,1\}\)</span> memiliki dua himpunan terbuka. Topologi <span class="process-math">\(\{\emptyset,\{1\},\{0,1\}\}\)</span> memiliki tiga, sedangkan topologi diskret memiliki empat. Karena jumlah ini berbeda pada setiap pasangan, tidak ada homeomorfisme di antara pasangan mana pun.</div>
