<div class="para">Karena <span class="process-math">\(A,B\)</span> berhingga dan tak kosong, semua maksimum ada. Untuk setiap <span class="process-math">\(a\in A\)</span> dan <span class="process-math">\(b\in B\text{,}\)</span> <span class="process-math">\(a\leq\max A\)</span> dan <span class="process-math">\(b\leq\max B\text{,}\)</span> jadi <span class="process-math">\(a+b\leq\max A+\max B\text{.}\)</span> Mengambil maksimum atas semua jumlah membuktikan ketaksamaan pertama.</div>
