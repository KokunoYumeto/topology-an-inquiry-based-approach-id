<div class="para">Irisan berhingga terbuka berdasarkan aksioma topologi, tetapi</div>
<div class="displaymath process-math">

\bigcap_{n=1}^{\infty}(-1/n,1/n)=\{0\},

</div>
<div class="para">yang tidak terbuka dalam topologi Euklides. Jadi “berhingga” dalam aksioma irisan tidak dapat diganti dengan “sebarang”.</div>
