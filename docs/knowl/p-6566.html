<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Kesamaan <span class="process-math">\(p(x)=p(x)\)</span> memberi refleksivitas. Jika <span class="process-math">\(p(x)=p(x')\text{,}\)</span> simetri kesamaan memberi <span class="process-math">\(p(x')=p(x)\text{.}\)</span> Jika <span class="process-math">\(p(x)=p(x')\)</span> dan <span class="process-math">\(p(x')=p(x'')\text{,}\)</span> transitivitas kesamaan memberi <span class="process-math">\(p(x)=p(x'')\text{.}\)</span> Jadi <span class="process-math">\(\sim_p\)</span> relasi ekuivalensi.</div>
