<div class="para">Untuk <span class="process-math">\(x,y,z\in X\text{,}\)</span> tetapkan <span class="process-math">\(a_i=d_i(x_i,y_i)\text{,}\)</span> <span class="process-math">\(b_i=d_i(y_i,z_i)\text{,}\)</span> dan <span class="process-math">\(c_i=d_i(x_i,z_i)\text{.}\)</span> Maka <span class="process-math">\(c_i\leq a_i+b_i\text{.}\)</span> Kembangkan <span class="process-math">\(\sum_i(a_i+b_i)^2\)</span> dan gunakan Cauchy-Schwarz pada <span class="process-math">\(\sum_i a_ib_i\text{.}\)</span>
