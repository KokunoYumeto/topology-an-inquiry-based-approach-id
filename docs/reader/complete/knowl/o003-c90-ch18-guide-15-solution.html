<div class="para">Karena <span class="process-math">\(U,V\)</span> takkosong, pilih <span class="process-math">\(u\in U\)</span> dan <span class="process-math">\(v\in V\text{.}\)</span> Kesurjektifan <span class="process-math">\(g\)</span> menghasilkan <span class="process-math">\(x_u,x_v\in X\)</span> dengan <span class="process-math">\(g(x_u)=u\)</span> dan <span class="process-math">\(g(x_v)=v\text{.}\)</span> Maka <span class="process-math">\(x_u\in g^{-1}(U)=R\)</span> dan <span class="process-math">\(x_v\in g^{-1}(V)=S\text{.}\)</span> Jadi <span class="process-math">\(R\)</span> serta <span class="process-math">\(S\)</span> takkosong.</div>
