<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Jika <span class="process-math">\(f\)</span> adalah fungsi dari himpunan <span class="process-math">\(A\)</span> ke himpunan <span class="process-math">\(B\)</span> dan <span class="process-math">\(g\)</span> adalah fungsi dari <span class="process-math">\(B\)</span> ke himpunan <span class="process-math">\(C\text{,}\)</span> komposit <span class="process-math">\(g \circ f\)</span> merupakan fungsi dari <span class="process-math">\(A\)</span> ke <span class="process-math">\(C\)</span> yang didefinisikan oleh <span class="process-math">\((g \circ f)(a) = g(f(a))\)</span> untuk setiap <span class="process-math">\(a \in A\text{.}\)</span>
</div>
