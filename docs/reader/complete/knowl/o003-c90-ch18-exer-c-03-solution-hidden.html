<body class="ignore-math"><div class="solution solution-like"><div class="para">Garis real terhubung. Untuk setiap <span class="process-math">\(c\in\mathbb R\text{,}\)</span> penghapusan <span class="process-math">\(c\)</span> menghasilkan <span class="process-math">\((-\infty,c)\cup(c,\infty)\text{.}\)</span> Kedua sinar tersebut tak kosong, saling lepas, dan relatif buka, sehingga <span class="process-math">\(\mathbb R\setminus\{c\}\)</span> tidak terhubung. Jadi terdapat tak hingga banyak titik pemutus.</div></div></body>
