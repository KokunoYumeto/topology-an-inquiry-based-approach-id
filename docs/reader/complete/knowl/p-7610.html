<div class="para">Akan tetapi, <span class="process-math">\(\{0\}\)</span> terbuka dalam <span class="process-math">\(X\text{,}\)</span> sedangkan <span class="process-math">\((f^{-1})^{-1}(\{0\})=\{0\}\)</span> tidak terbuka dalam <span class="process-math">\(Y\text{.}\)</span> Maka <span class="process-math">\(f^{-1}\)</span> tidak kontinu dan <span class="process-math">\(f\)</span> bukan homeomorfisme. Contoh ini juga memperlihatkan mengapa syarat Hausdorff pada kodomain diperlukan.</div>
