<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Untuk setiap <span class="process-math">\(x\neq0\text{,}\)</span> berlaku <span class="process-math">\(x=1x\)</span> dan <span class="process-math">\(1\neq0\text{,}\)</span> sehingga <span class="process-math">\(x\sim_P x\text{.}\)</span> Jika <span class="process-math">\(x\sim_P y\text{,}\)</span> ada <span class="process-math">\(k\neq0\)</span> dengan <span class="process-math">\(y=kx\text{.}\)</span> Maka <span class="process-math">\(x=k^{-1}y\text{,}\)</span> dan <span class="process-math">\(k^{-1}\neq0\text{,}\)</span> sehingga <span class="process-math">\(y\sim_P x\text{.}\)</span>
