<body class="ignore-math"><div class="solution solution-like"><div class="para">Dalam ruang Hausdorff <span class="process-math">\(\mathbb R\text{,}\)</span> ambil <span class="process-math">\(A=\{0,1\}\text{.}\)</span> Himpunan berhingga ini kompak. Dalam topologi subruang, <span class="process-math">\(\{0\}=A\cap(-1/2,1/2)\)</span> dan <span class="process-math">\(\{1\}=A\cap(1/2,3/2)\)</span> adalah himpunan buka tak kosong yang saling lepas dan menutupi <span class="process-math">\(A\text{.}\)</span> Jadi <span class="process-math">\(A\)</span> tidak terhubung.</div></div></body>
