<div class="para">Jika <span class="process-math">\(x\sim y\text{,}\)</span> ada subhimpunan terhubung <span class="process-math">\(C\subseteq X\)</span> dengan <span class="process-math">\(x,y\in C\text{.}\)</span> Pernyataan <span class="process-math">\(x,y\in C\)</span> setara dengan <span class="process-math">\(y,x\in C\text{.}\)</span> Himpunan yang sama menyaksikan <span class="process-math">\(y\sim x\text{.}\)</span> Maka relasi tersebut simetris.</div>
