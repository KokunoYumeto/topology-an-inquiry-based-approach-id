<body class="ignore-math"><div class="answer solution-like"><div class="para">Jika <span class="process-math">\(\alpha X\)</span> metrik kompak, ia terhitung kedua dan sifat itu diwarisi <span class="process-math">\(X\text{.}\)</span> Jika <span class="process-math">\(X\)</span> terhitung kedua, basis relatif kompak menghasilkan basis terhitung di <span class="process-math">\(\infty\text{;}\)</span> maka <span class="process-math">\(\alpha X\)</span> kompak Hausdorff, terhitung kedua, dan termetrisasi oleh Urysohn.</div></div></body>
