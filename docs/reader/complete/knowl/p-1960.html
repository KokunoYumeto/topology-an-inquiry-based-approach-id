<div class="para">Carilah suatu fungsi kontinu dari <span class="process-math">\(X/\ssim\)</span> ke <span class="process-math">\(Y\text{.}\)</span> <a href="" class="xref" data-knowl="./knowl/thm_quotient_2.html" title="Teorema 16.9">Teorema 16.9</a> memberi tahu kita bahwa fungsi <span class="process-math">\(\overline{f} : (X/\ssim) \to Y\)</span> yang didefinisikan oleh <span class="process-math">\(\overline{f}([t]) = f(t)\)</span> bersifat kontinu. Jadi, <span class="process-math">\(\overline{f}\)</span> merupakan kandidat homeomorfisme kita.</div>
