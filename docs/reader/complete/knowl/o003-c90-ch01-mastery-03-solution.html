<div class="para">Karena <span class="process-math">\(A_n\subseteq A_1\)</span> dan <span class="process-math">\(A_1\)</span> sendiri ikut dalam keluarga, gabungannya <span class="process-math">\(A_1\text{.}\)</span> Nol berada di semua interval. Jika <span class="process-math">\(x\neq0\text{,}\)</span> ambil <span class="process-math">\(n\gt1/|x|\text{;}\)</span> maka <span class="process-math">\(|x|\gt1/n\text{,}\)</span> sehingga <span class="process-math">\(x\notin A_n\text{.}\)</span>
