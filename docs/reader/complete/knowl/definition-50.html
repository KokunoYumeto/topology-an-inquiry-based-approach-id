</h3> <div class="para">Suatu ruang topologi <span class="process-math">\(X\)</span> disebut ruang <dfn class="terminology">Hausdorff</dfn> jika untuk setiap pasangan titik berbeda <span class="process-math">\(x\text{,}\)</span> <span class="process-math">\(y\)</span> dalam <span class="process-math">\(X\text{,}\)</span> terdapat himpunan terbuka <span class="process-math">\(O_x\)</span> yang memuat <span class="process-math">\(x\)</span> dan <span class="process-math">\(O_y\)</span> yang memuat <span class="process-math">\(y\)</span> sedemikian sehingga <span class="process-math">\(O_x \cap O_y = \emptyset\text{.}\)</span>
