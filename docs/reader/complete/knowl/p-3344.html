<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Ada <span class="process-math">\(N\in\Z^+\)</span> dengan <span class="process-math">\(N\gt M-1\text{,}\)</span> sehingga <span class="process-math">\(N+1\in\Z^+\)</span> dan <span class="process-math">\(N+1\gt M\text{.}\)</span> Ini bertentangan dengan <span class="process-math">\(M\)</span> sebagai batas atas. Jadi <span class="process-math">\(\Z^+\)</span> tidak terbatas di atas, yang persis menyatakan bahwa untuk setiap <span class="process-math">\(x\in\R\)</span> ada <span class="process-math">\(N\in\Z^+\)</span> dengan <span class="process-math">\(N\gt x\text{.}\)</span>
