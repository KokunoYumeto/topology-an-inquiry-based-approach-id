<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Subhimpunan buka-tertutup sejati <span class="process-math">\(A\)</span> menghasilkan pemisahan <span class="process-math">\(A\)</span> dan <span class="process-math">\(X\setminus A\text{.}\)</span> Sebaliknya, setiap pemisahan <span class="process-math">\(U,V\)</span> membuat <span class="process-math">\(U\)</span> terbuka dan tertutup karena <span class="process-math">\(X\setminus U=V\text{.}\)</span> Karena itu kedua kondisi ekuivalen.</div>
