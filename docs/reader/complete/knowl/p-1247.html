<h5 class="heading"><span class="type">Paragraph</span></h5>
<div class="para">Tunjukkan bahwa <span class="process-math">\(d'\)</span> merupakan metrik pada <span class="process-math">\(A\text{.}\)</span> Karena <span class="process-math">\(d'\)</span> merupakan metrik pada <span class="process-math">\(A\text{,}\)</span> maka <span class="process-math">\((A,d')\)</span> merupakan ruang metrik. Metrik <span class="process-math">\(d'\)</span> merupakan <dfn class="terminology">pembatasan</dfn> dari <span class="process-math">\(d\)</span> pada <span class="process-math">\(A \times A\)</span> dan dapat pula dinotasikan dengan <span class="process-math">\(d_A\text{.}\)</span>
</div>
