<div class="para">Sebagaimana ditunjukkan oleh <a href="" class="xref" data-knowl="./knowl/act_connected_subsets_R.html" title="Kegiatan 18.6">Kegiatan 18.6</a>, ruang seperti <span class="process-math">\(A = (1,2) \cup (3,4)\)</span> tidak terhubung. Meskipun demikian, <span class="process-math">\(A\)</span> tersusun atas dua subhimpunan terhubung <span class="process-math">\((1,2)\)</span> dan <span class="process-math">\((3,4)\text{.}\)</span> Subhimpunan-subhimpunan terhubung ini disebut <dfn class="terminology">komponen</dfn>.</div>
