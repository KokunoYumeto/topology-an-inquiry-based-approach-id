<div class="para">Suatu ruang topologi <span class="process-math">\((X,\tau)\)</span> disebut <dfn class="terminology">terhubung</dfn> jika <span class="process-math">\(X\)</span> tidak dapat dituliskan sebagai gabungan dua subhimpunan buka yang saling lepas dan takkosong. Suatu subhimpunan <span class="process-math">\(A\)</span> dari ruang topologi <span class="process-math">\((X,\tau)\)</span> disebut terhubung jika <span class="process-math">\(A\)</span> terhubung dalam topologi subruang.</div>
