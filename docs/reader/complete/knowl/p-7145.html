<div class="para">Jika <span class="process-math">\(x\sim_P y\)</span> dan <span class="process-math">\(y\sim_P z\text{,}\)</span> pilih skalar tak nol <span class="process-math">\(k\)</span> dan <span class="process-math">\(\ell\)</span> sehingga <span class="process-math">\(y=kx\)</span> dan <span class="process-math">\(z=\ell y\text{.}\)</span> Kemudian <span class="process-math">\(z=(\ell k)x\text{,}\)</span> dan <span class="process-math">\(\ell k\neq0\text{.}\)</span> Jadi <span class="process-math">\(x\sim_P z\text{.}\)</span> Ketiga aksioma relasi ekuivalensi telah dipenuhi.</div>
