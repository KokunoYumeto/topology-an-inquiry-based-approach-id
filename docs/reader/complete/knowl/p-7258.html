<h3 class="heading"><span class="type">Paragraph</span></h3>
<div class="para">Misalkan <span class="process-math">\(\sim\)</span> relasi ekuivalensi pada himpunan <span class="process-math">\(X\)</span> dan <span class="process-math">\(q:X\to X/\ssim\)</span> proyeksi kanonis. Jika fungsi <span class="process-math">\(f:X\to Z\)</span> memenuhi <span class="process-math">\(x\sim y\Rightarrow f(x)=f(y)\text{,}\)</span> buktikan bahwa terdapat tepat satu fungsi <span class="process-math">\(\bar f:X/\ssim\to Z\)</span> dengan <span class="process-math">\(f=\bar f\circ q\text{.}\)</span>
